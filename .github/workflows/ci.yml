name: 持续集成

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: 语法与功能冒烟
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 配置 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: 语法检查
        run: python -m py_compile campus_registration_analyzer.py
      - name: 功能冒烟（加载示例数据 → 分析 → 报告）
        run: printf '2\nsample_data.csv\n4\n5\n0\n' | python campus_registration_analyzer.py
